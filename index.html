<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply to FaceValue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Apply Now</h1>
        <p class="intro-text">Congratulations on being invited to facevalue once you submit your info our ai will scan your profile and rank you based on looks. you will then be invited to parties in your area with others ranked most similarly to you!</p>
        <form id="userInfoForm" action="https://script.google.com/macros/s/AKfycbzCc61ZnTmexNVztiuhTqWecyEzedR6q9DAp3R3FElDMKcd6Nz2mVaTsD8VSyyY2xMw/exec" method="GET" target="hidden-iframe" onsubmit="return handleSubmit(event)">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="location">Location:</label>
                <input type="text" id="location" name="location" required placeholder="e.g., City, State">
            </div>
            <div class="form-group">
                <label for="photo1">Face Photo:</label>
                <input type="file" id="photo1" name="face_photo" accept="image/*" required>
            </div>
            <div class="form-group">
                <label for="photo2">Full Body Photo:</label>
                <input type="file" id="photo2" name="body_photo" accept="image/*" required>
            </div>
            <button type="submit">Submit</button>
        </form>
        <iframe name="hidden-iframe" style="display:none;"></iframe>
    </div>
    <script>
        async function handleSubmit(event) {
            event.preventDefault();
            
            // Show loading state
            const container = document.querySelector('.container');
            container.innerHTML = `
                <div style="text-align: center; padding: 40px;">
                    <div style="width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #5c67f2; border-radius: 50%; margin: 20px auto; animation: spin 1s linear infinite;"></div>
                    <p style="color: #333; font-size: 1.1em; margin-top: 20px;">Our AI agent is now ranking your profile based on looks</p>
                </div>
                <style>
                    @keyframes spin {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                    }
                </style>
            `;

            try {
                // Get form data
                const form = document.getElementById('userInfoForm');
                const formData = new FormData(form);
                
                // Convert files to base64
                const facePhoto = await fileToBase64(formData.get('face_photo'));
                const bodyPhoto = await fileToBase64(formData.get('body_photo'));
                
                // Create a new form for submission
                const submitForm = document.createElement('form');
                submitForm.method = 'GET';
                submitForm.action = form.action;
                submitForm.target = 'hidden-iframe';
                
                // Add form fields
                const fields = {
                    name: formData.get('name'),
                    phone: formData.get('phone'),
                    location: formData.get('location'),
                    face_photo: facePhoto,
                    body_photo: bodyPhoto
                };
                
                // Add fields to form
                Object.entries(fields).forEach(([key, value]) => {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = value;
                    submitForm.appendChild(input);
                });
                
                // Add form to document and submit
                document.body.appendChild(submitForm);
                submitForm.submit();
                
                // Redirect to success page after 15 seconds
                setTimeout(function() {
                    window.location.href = 'success.html';
                }, 15000);
                
            } catch (error) {
                console.error('Error:', error);
                alert('There was an error submitting your form. Please try again.');
                location.reload();
            }
            
            return false;
        }
        
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
