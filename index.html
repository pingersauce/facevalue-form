<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply to FaceValue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Apply Now</h1>
        <p class="intro-text">Congratulations on being invited to facevalue once you submit your info our ai will scan your profile and rank you based on looks. you will then be invited to parties in your area with others ranked most similarly to you!</p>
        <form id="userInfoForm" onsubmit="return handleSubmit(event)">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="location">Location:</label>
                <input type="text" id="location" name="location" required placeholder="e.g., City, State">
            </div>
            <div class="form-group">
                <label for="photo1">Face Photo:</label>
                <input type="file" id="photo1" name="face_photo" accept="image/*" required>
            </div>
            <div class="form-group">
                <label for="photo2">Full Body Photo:</label>
                <input type="file" id="photo2" name="body_photo" accept="image/*" required>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>
    <script>
        function handleSubmit(event) {
            event.preventDefault();
            
            // Show loading state
            const container = document.querySelector('.container');
            container.innerHTML = `
                <div style="text-align: center; padding: 40px;">
                    <div style="width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #5c67f2; border-radius: 50%; margin: 20px auto; animation: spin 1s linear infinite;"></div>
                    <p style="color: #333; font-size: 1.1em; margin-top: 20px;">Our AI agent is now ranking your profile based on looks</p>
                </div>
                <style>
                    @keyframes spin {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                    }
                </style>
            `;

            // Get form data
            const form = document.getElementById('userInfoForm');
            const formData = new FormData(form);
            
            // Create URL with parameters
            const url = new URL('https://script.google.com/macros/s/AKfycbz_a6BosDnErMiQ-2eMIUE6b-Mg1vYNqFUDcNn_oCe0XAEqCQhvuHvFO1YTU5INWKiq/exec');
            url.searchParams.append('name', formData.get('name'));
            url.searchParams.append('phone', formData.get('phone'));
            url.searchParams.append('location', formData.get('location'));
            
            // Start the redirect timer immediately
            setTimeout(function() {
                window.location.replace('success.html');
            }, 5000);
            
            // Submit the form data
            fetch(url.toString(), {
                method: 'GET',
                mode: 'no-cors'
            }).catch(error => {
                console.error('Error:', error);
                // Don't show error to user since we're redirecting anyway
            });
            
            return false;
        }
    </script>
</body>
</html>
