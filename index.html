<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply to FaceValue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Apply Now</h1>
        <p class="intro-text">Congratulations on being invited to facevalue once you submit your info our ai will scan your profile and rank you based on looks. you will then be invited to parties in your area with others ranked most similarly to you!</p>
        <form id="userInfoForm" onsubmit="return handleSubmit(event)">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="location">Location:</label>
                <input type="text" id="location" name="location" required placeholder="e.g., City, State">
            </div>
            <div class="form-group">
                <label for="photo1">Face Photo:</label>
                <input type="file" id="photo1" name="face_photo" accept="image/*" required>
            </div>
            <div class="form-group">
                <label for="photo2">Full Body Photo:</label>
                <input type="file" id="photo2" name="body_photo" accept="image/*" required>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>
    <script>
        function handleSubmit(event) {
            event.preventDefault();
            
            // Get form data
            const form = document.getElementById('userInfoForm');
            const formData = new FormData(form);
            
            // Create URL with parameters
            const url = new URL('https://script.google.com/macros/s/AKfycbzqoK6ffb8PTfmGitE8FGz9xWsg8UW5yE1IabRiLwpxsSl6pZpPJ4Se146l87ixB_Kp/exec');
            url.searchParams.append('name', formData.get('name'));
            url.searchParams.append('phone', formData.get('phone'));
            url.searchParams.append('location', formData.get('location'));
            
            console.log('Submitting form data to:', url.toString());
            
            // Show loading state
            const container = document.querySelector('.container');
            container.innerHTML = `
                <div style="text-align: center; padding: 40px;">
                    <div style="width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #5c67f2; border-radius: 50%; margin: 20px auto; animation: spin 1s linear infinite;"></div>
                    <p style="color: #333; font-size: 1.1em; margin-top: 20px;">Our AI agent is now ranking your profile based on looks</p>
                </div>
                <style>
                    @keyframes spin {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                    }
                </style>
            `;
            
            // Submit the form data
            fetch(url.toString(), {
                method: 'GET',
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                console.log('Response status:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('Response data:', data);
                if (data.status === 'success') {
                    setTimeout(() => {
                        document.location.href = 'success.html';
                    }, 5000);
                } else {
                    throw new Error(data.message || 'Form submission failed');
                }
            })
            .catch(error => {
                console.error('Error submitting form:', error);
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <p style="color: #ff4444; font-size: 1.1em;">There was an error submitting your form. Please try again.</p>
                        <button onclick="window.location.reload()" style="margin-top: 20px; padding: 10px 20px; background-color: #5c67f2; color: white; border: none; border-radius: 4px; cursor: pointer;">Try Again</button>
                    </div>
                `;
            });
            
            return false;
        }
    </script>
</body>
</html>
